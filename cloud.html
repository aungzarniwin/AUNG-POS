<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>AUNG POS Cloud</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#172033;
  --muted:#6b7280;
  --line:#e5e7eb;
  --primary:#111827;
  --primary2:#1f2937;
  --green:#16a34a;
  --red:#dc2626;
  --orange:#ea580c;
  --blue:#2563eb;
  --shadow:0 10px 30px rgba(15,23,42,.07);
  --radius:18px;
}

html,body{
  min-height:100%;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Myanmar",
    "Myanmar Text",
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   AUTH
========================= */

.auth-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top right,#dbeafe,transparent 35%),
    radial-gradient(circle at bottom left,#dcfce7,transparent 30%),
    #f8fafc;
}

.auth-card{
  width:100%;
  max-width:480px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:26px;
  box-shadow:0 20px 60px rgba(15,23,42,.12);
  padding:28px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:24px;
}

.brand-icon{
  width:48px;
  height:48px;
  border-radius:14px;
  background:#111827;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:18px;
}

.brand h1{
  font-size:21px;
}

.brand p{
  color:var(--muted);
  font-size:13px;
  margin-top:2px;
}

.auth-title{
  font-size:24px;
  margin-bottom:7px;
}

.auth-subtitle{
  color:var(--muted);
  font-size:14px;
  margin-bottom:20px;
  line-height:1.6;
}

.form-grid{
  display:grid;
  gap:14px;
}

.field{
  display:grid;
  gap:7px;
}

.field label{
  font-size:13px;
  font-weight:700;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid #d7dce3;
  background:#fff;
  border-radius:12px;
  padding:12px 13px;
  outline:none;
  transition:.2s;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#111827;
  box-shadow:0 0 0 3px rgba(17,24,39,.07);
}

.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.primary-btn,
.secondary-btn,
.danger-btn,
.success-btn{
  border:0;
  border-radius:12px;
  padding:12px 15px;
  font-weight:800;
}

.primary-btn{
  background:#111827;
  color:#fff;
}

.primary-btn:hover{
  background:#000;
}

.secondary-btn{
  background:#eef2f7;
  color:#172033;
}

.success-btn{
  background:#dcfce7;
  color:#166534;
}

.danger-btn{
  background:#fee2e2;
  color:#991b1b;
}

.full{
  width:100%;
}

.auth-switch{
  text-align:center;
  margin-top:18px;
  color:var(--muted);
  font-size:14px;
}

.auth-switch button{
  border:0;
  background:none;
  color:#111827;
  font-weight:800;
}

.message{
  padding:11px 13px;
  border-radius:12px;
  font-size:13px;
  line-height:1.5;
  margin-bottom:14px;
}

.message.error{
  background:#fee2e2;
  color:#991b1b;
}

.message.success{
  background:#dcfce7;
  color:#166534;
}

.message.info{
  background:#e0f2fe;
  color:#075985;
}

/* =========================
   APP
========================= */

.app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:260px;
  flex:0 0 260px;
  background:#111827;
  color:#fff;
  min-height:100vh;
  padding:20px 14px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}

.sidebar-brand{
  padding:8px 10px 20px;
}

.sidebar-brand strong{
  font-size:18px;
}

.sidebar-brand span{
  display:block;
  color:#9ca3af;
  font-size:12px;
  margin-top:4px;
}

.nav{
  display:grid;
  gap:6px;
}

.nav button{
  border:0;
  background:transparent;
  color:#cbd5e1;
  text-align:left;
  padding:12px 13px;
  border-radius:11px;
  font-weight:700;
}

.nav button:hover,
.nav button.active{
  background:#1f2937;
  color:#fff;
}

.sidebar-bottom{
  margin-top:24px;
  padding-top:16px;
  border-top:1px solid #374151;
}

.user-box{
  padding:12px;
  border-radius:12px;
  background:#1f2937;
  margin-bottom:10px;
}

.user-box strong{
  display:block;
  font-size:14px;
}

.user-box span{
  color:#9ca3af;
  font-size:12px;
}

.main{
  flex:1;
  min-width:0;
}

.topbar{
  height:70px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:20;
}

.menu-btn{
  display:none;
  border:0;
  background:#eef2f7;
  width:42px;
  height:42px;
  border-radius:11px;
}

.page{
  padding:24px;
  max-width:1500px;
  margin:auto;
}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.page-head h2{
  font-size:24px;
}

.page-head p{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.stat{
  padding:20px;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

.stat-value{
  font-size:28px;
  font-weight:900;
  margin-top:8px;
}

.stat-small{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.section{
  margin-top:20px;
}

.section-card{
  padding:20px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.section-title h3{
  font-size:17px;
}

/* =========================
   PRODUCTS
========================= */

.product-layout{
  display:grid;
  grid-template-columns:390px 1fr;
  gap:20px;
  align-items:start;
}

.product-form{
  padding:20px;
  position:sticky;
  top:90px;
}

.photo-upload{
  border:2px dashed #d1d5db;
  border-radius:16px;
  min-height:190px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:8px;
  overflow:hidden;
  background:#f8fafc;
  margin-bottom:16px;
}

.photo-upload img{
  width:100%;
  height:210px;
  object-fit:cover;
}

.photo-upload strong{
  font-size:14px;
}

.photo-upload span{
  color:var(--muted);
  font-size:12px;
}

.photo-actions{
  display:flex;
  gap:8px;
  width:100%;
  padding:0 12px 12px;
}

.photo-actions button{
  flex:1;
}

.product-list-card{
  padding:20px;
}

.search-row{
  display:flex;
  gap:10px;
  margin-bottom:16px;
}

.search-row input,
.search-row select{
  flex:1;
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 12px;
  background:#fff;
  outline:none;
}

.products-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.product-card{
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  background:#fff;
  transition:.2s;
}

.product-card:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}

.product-photo{
  width:100%;
  height:180px;
  background:#f1f5f9;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.product-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.no-photo{
  color:#94a3b8;
  font-size:35px;
}

.product-body{
  padding:14px;
}

.product-name{
  font-weight:900;
  font-size:16px;
  line-height:1.4;
}

.product-meta{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.price-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.price-box{
  background:#f8fafc;
  border-radius:10px;
  padding:9px;
}

.price-box span{
  display:block;
  color:var(--muted);
  font-size:10px;
}

.price-box strong{
  font-size:14px;
}

.stock-row{
  margin-top:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.stock-badge{
  padding:5px 8px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
}

.stock-ok{
  background:#dcfce7;
  color:#166534;
}

.stock-low{
  background:#ffedd5;
  color:#9a3412;
}

.stock-out{
  background:#fee2e2;
  color:#991b1b;
}

.card-actions{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.card-actions button{
  flex:1;
  padding:9px;
  border:0;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
}

/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;
  padding:50px 20px;
  color:var(--muted);
}

.empty-icon{
  font-size:40px;
  margin-bottom:10px;
}

/* =========================
   MODAL
========================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal{
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:20px;
  padding:22px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.close-btn{
  border:0;
  background:#f1f5f9;
  width:38px;
  height:38px;
  border-radius:10px;
}

/* =========================
   LOADING
========================= */

.loading{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:200;
}

.loading-box{
  background:#111827;
  color:#fff;
  padding:16px 20px;
  border-radius:13px;
  font-size:14px;
  font-weight:700;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){
  .product-layout{
    grid-template-columns:1fr;
  }

  .product-form{
    position:static;
  }

  .products-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:760px){
  .sidebar{
    position:fixed;
    left:-280px;
    top:0;
    z-index:80;
    transition:.25s;
  }

  .sidebar.open{
    left:0;
  }

  .menu-btn{
    display:block;
  }

  .topbar{
    padding:0 14px;
  }

  .page{
    padding:15px;
  }

  .page-head{
    align-items:flex-start;
  }

  .page-head h2{
    font-size:21px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat{
    padding:15px;
  }

  .stat-value{
    font-size:22px;
  }

  .products-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .product-photo{
    height:145px;
  }

  .product-body{
    padding:11px;
  }

  .two-col{
    grid-template-columns:1fr;
  }
}

@media(max-width:500px){
  .auth-card{
    padding:20px;
    border-radius:20px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .products-grid{
    grid-template-columns:1fr;
  }

  .search-row{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<!-- =========================
     LOADING
========================= -->

<div id="loading" class="loading hidden">
  <div class="loading-box" id="loadingText">လုပ်ဆောင်နေသည်...</div>
</div>

<!-- =========================
     AUTH
========================= -->

<section id="authPage" class="auth-page">

  <div class="auth-card">

    <div class="brand">
      <div class="brand-icon">AP</div>
      <div>
        <h1>AUNG POS</h1>
        <p>Commercial Cloud POS</p>
      </div>
    </div>

    <div id="authMessage"></div>

    <!-- LOGIN -->

    <div id="loginBox">

      <h2 class="auth-title">Login</h2>

      <p class="auth-subtitle">
        သင့် Business Account ထဲသို့ ဝင်ပါ
      </p>

      <form id="loginForm" class="form-grid">

        <div class="field">
          <label>Email</label>
          <input
            id="loginEmail"
            type="email"
            required
            autocomplete="email"
            placeholder="example@email.com">
        </div>

        <div class="field">
          <label>Password</label>
          <input
            id="loginPassword"
            type="password"
            required
            autocomplete="current-password"
            placeholder="Password">
        </div>

        <button class="primary-btn full" type="submit">
          Login
        </button>

      </form>

      <div class="auth-switch">
        Account မရှိသေးပါလား?
        <button id="showRegisterBtn" type="button">
          Register
        </button>
      </div>

    </div>

    <!-- REGISTER -->

    <div id="registerBox" class="hidden">

      <h2 class="auth-title">Create Business</h2>

      <p class="auth-subtitle">
        AUNG POS Cloud Business Account အသစ်ဖန်တီးပါ
      </p>

      <form id="registerForm" class="form-grid">

        <div class="field">
          <label>Business / Shop Name</label>
          <input id="regBusinessName" required placeholder="ဆိုင်အမည်">
        </div>

        <div class="two-col">

          <div class="field">
            <label>Admin Name</label>
            <input id="regFullName" required placeholder="Admin Name">
          </div>

          <div class="field">
            <label>Username</label>
            <input id="regUsername" required placeholder="admin">
          </div>

        </div>

        <div class="field">
          <label>Phone</label>
          <input id="regPhone" placeholder="09xxxxxxxxx">
        </div>

        <div class="field">
          <label>Address</label>
          <textarea id="regAddress" placeholder="ဆိုင်လိပ်စာ"></textarea>
        </div>

        <div class="field">
          <label>Email</label>
          <input
            id="regEmail"
            type="email"
            required
            autocomplete="email"
            placeholder="example@email.com">
        </div>

        <div class="two-col">

          <div class="field">
            <label>Password</label>
            <input
              id="regPassword"
              type="password"
              required
              minlength="6"
              autocomplete="new-password">
          </div>

          <div class="field">
            <label>Confirm Password</label>
            <input
              id="regPassword2"
              type="password"
              required
              minlength="6"
              autocomplete="new-password">
          </div>

        </div>

        <button class="primary-btn full" type="submit">
          Create Business Account
        </button>

      </form>

      <div class="auth-switch">
        Account ရှိပြီးသားလား?
        <button id="showLoginBtn" type="button">
          Login
        </button>
      </div>

    </div>

  </div>

</section>

<!-- =========================
     APP
========================= -->

<section id="app" class="app hidden">

  <aside id="sidebar" class="sidebar">

    <div class="sidebar-brand">
      <strong>AUNG POS</strong>
      <span>Commercial Cloud POS</span>
    </div>

    <nav class="nav">

      <button class="nav-btn active" data-page="dashboard">
        📊 Dashboard
      </button>

      <button class="nav-btn" data-page="products">
        📦 Products
      </button>

      <button class="nav-btn" data-page="sales">
        🛒 Sales / POS
      </button>

      <button class="nav-btn" data-page="purchases">
        📥 Purchases
      </button>

      <button class="nav-btn" data-page="inventory">
        📦 Inventory
      </button>

      <button class="nav-btn" data-page="customers">
        👥 Customers
      </button>

      <button class="nav-btn" data-page="suppliers">
        🚚 Suppliers
      </button>

      <button class="nav-btn" data-page="reports">
        📈 Reports
      </button>

      <button class="nav-btn" data-page="subscription">
        💳 Subscription
      </button>

      <button class="nav-btn" data-page="settings">
        ⚙️ Settings
      </button>

    </nav>

    <div class="sidebar-bottom">

      <div class="user-box">
        <strong id="sideUserName">Admin</strong>
        <span id="sideBusinessName">Business</span>
      </div>

      <button id="logoutBtn" class="danger-btn full">
        Logout
      </button>

    </div>

  </aside>

  <main class="main">

    <header class="topbar">

      <button id="menuBtn" class="menu-btn">
        ☰
      </button>

      <div>
        <strong id="topBusinessName">AUNG POS</strong>
      </div>

      <div>
        <span id="topRole" style="font-size:12px;color:#6b7280">
          Admin
        </span>
      </div>

    </header>

    <div id="pageContainer" class="page"></div>

  </main>

</section>

<!-- =========================
     MODAL
========================= -->

<div id="simpleModal" class="modal-backdrop hidden">

  <div class="modal">

    <div class="modal-head">
      <strong id="modalTitle">Information</strong>

      <button
        id="modalClose"
        class="close-btn"
        type="button">
        ✕
      </button>
    </div>

    <div id="modalBody"></div>

  </div>

</div>

<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://bguonfdxhbxwgsqibppp.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_3ioj1nwzoQWk4CWMjayu1w_EmlU4D1Z";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* =========================================================
   STATE
========================================================= */

const state = {
  user:null,
  business:null,
  businessUser:null,
  products:[],
  categories:[],
  subcategories:[],
  units:[],
  currentProductId:null,
  selectedPhoto:null
};


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function money(value){
  return Number(value || 0).toLocaleString("en-US");
}

function showLoading(text="လုပ်ဆောင်နေသည်..."){
  $("loadingText").textContent = text;
  $("loading").classList.remove("hidden");
}

function hideLoading(){
  $("loading").classList.add("hidden");
}

function showMessage(text,type="error"){
  $("authMessage").innerHTML =
    `<div class="message ${type}">${escapeHtml(text)}</div>`;
}

function clearMessage(){
  $("authMessage").innerHTML="";
}

function today(){
  return new Date().toISOString().slice(0,10);
}

function openModal(title,html){
  $("modalTitle").textContent=title;
  $("modalBody").innerHTML=html;
  $("simpleModal").classList.remove("hidden");
}

function closeModal(){
  $("simpleModal").classList.add("hidden");
}

$("modalClose").addEventListener("click",closeModal);

$("simpleModal").addEventListener("click",e=>{
  if(e.target === $("simpleModal")){
    closeModal();
  }
});


/* =========================================================
   AUTH VIEW
========================================================= */

function showLogin(){
  $("loginBox").classList.remove("hidden");
  $("registerBox").classList.add("hidden");
  clearMessage();
}

function showRegister(){
  $("loginBox").classList.add("hidden");
  $("registerBox").classList.remove("hidden");
  clearMessage();
}

async function loadProducts(){

  }

  const {
    data,
    error
  } =
  await supabaseClient
    .from("products")
    .select("*")
    .eq("business_id",state.business.id)

  }

  state.products=data || [];

/* =========================================================
   MASTERS
========================================================= */

function buildMasters(){

  const categories =
    new Set();

  const subcategories =
    new Set();

  const units =
    new Set();

  state.products.forEach(p=>{

    if(p.category)
      categories.add(p.category);

    if(p.subcategory)
      subcategories.add(p.subcategory);

    if(p.unit)
      units.add(p.unit);

  });

  state.categories=[
    ...categories
  ].sort();

  state.subcategories=[
    ...subcategories
  ].sort();

  state.units=[
    ...units
  ].sort();
}


/* =========================================================
   MASTER SELECT
========================================================= */

function masterOptions(items,selected){

  let html=
    `<option value="">ရွေးချယ်ပါ</option>`;

  items.forEach(item=>{

    html +=
      `<option
        value="${escapeHtml(item)}"
        ${item===selected?"selected":""}>
        ${escapeHtml(item)}
      </option>`;

  });

  html +=
    `<option value="__new__">
      ＋ အသစ်ထည့်မည်
    </option>`;

  return html;
}

/* =========================================================
   SET SELECT
========================================================= */

function setSelectValue(
  selectId,
  value,
  wrapId,
  inputId
){

  const select=$(selectId);

  const exists =
    [...select.options]
      .some(
        o=>o.value===value
      );

  if(value && exists){

    select.value=value;

    $(wrapId)
      .classList
      .add("hidden");

  }else if(value){

    select.value="__new__";

    $(wrapId)
      .classList
      .remove("hidden");

    $(inputId).value=value;

  }else{

    select.value="";

    $(wrapId)
      .classList
      .add("hidden");

  }

}

/* =========================================================
   COMPRESS IMAGE
========================================================= */

async function compressImage(file){

  return new Promise((resolve,reject)=>{

    const img=new Image();

    const url=
      URL.createObjectURL(file);

    img.onload=()=>{

      let width=img.width;
      let height=img.height;

      const max=1200;

      if(width>max || height>max){

        if(width>height){

          height =
            Math.round(
              height * max / width
            );

          width=max;

        }else{

          width =
            Math.round(
              width * max / height
            );

          height=max;

        }

      }

      const canvas=
        document.createElement("canvas");

      canvas.width=width;
      canvas.height=height;

      const ctx=
        canvas.getContext("2d");

      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );

      canvas.toBlob(
        blob=>{

          URL.revokeObjectURL(url);

          if(!blob){

            reject(
              new Error("Image compression failed")
            );

            return;
          }

          resolve(blob);

        },
        "image/jpeg",
        .82
      );

    };

    img.onerror=()=>{

      URL.revokeObjectURL(url);

      reject(
        new Error("Image load failed")
      );

    };

    img.src=url;

  });

}


/* =========================================================
   UPLOAD PHOTO
========================================================= */

async function uploadProductPhoto(
  file,
  businessId
){

  const blob =
    await compressImage(file);

  const filename =
    `${Date.now()}-${Math.random()
      .toString(36)
      .slice(2)}.jpg`;

  const path =
    `${businessId}/${filename}`;

  const {
    data,
    error
  } =
  await supabaseClient
    .storage
    .from("product-images")
    .upload(
      path,
      blob,
      {
        contentType:"image/jpeg",
        cacheControl:"3600",
        upsert:false
      }
    );

  if(error){
    throw error;
  }

  return data.path;

}

  if(unit==="__new__"){

      $("newUnit").value.trim();
  }

  if(!name){

    alert("Product Name ထည့်ပါ");

    return;
  }

  if(!category){

    alert("Category ရွေးပါ");

    return;
  }

  if(!unit){

    alert("Unit ရွေးပါ");

    return;
  }

  showLoading(
    state.currentProductId
      ? "Product ပြင်နေသည်..."
      : "Product သိမ်းနေသည်..."
  );

  try{

    let photoPath=null;

    /*
      Existing photo
    */

    if(state.currentProductId){

      const existing =
        state.products.find(
          p=>p.id===state.currentProductId
        );

      photoPath =
        existing?.photo_path || null;

    }

    /*
      New photo
    */

    if(state.selectedPhoto){

      photoPath =
        await uploadProductPhoto(
          state.selectedPhoto,
          state.business.id
        );

    }

    const payload={

      business_id:
        state.business.id,

      name,

      barcode:
        $("barcode").value.trim() || null,

      category:
        category || null,

      subcategory:
        subcategory || null,

      unit:
        unit || null,

      buy_price:
        Number($("buyPrice").value || 0),

      retail_price:
        Number($("retailPrice").value || 0),

      wholesale_price:
        Number($("wholesalePrice").value || 0),

      stock:
        Number($("stock").value || 0),

      min_stock:
        Number($("minStock").value || 0),

      expiry:
        $("expiry").value || null,

      variant:
        $("variant").value.trim() || null,

      photo_path:
        photoPath,

      updated_at:
        new Date().toISOString()

    };


    let result;

    if(state.currentProductId){

      result =
        await supabaseClient
          .from("products")
          .update(payload)
          .eq(
            "id",
            state.currentProductId
          )
          .eq(
            "business_id",
            state.business.id
          );

    }else{

      result =
        await supabaseClient
          .from("products")
          .insert(payload);

    }

    if(result.error){
      throw result.error;
    }

    await loadProducts();

    renderProductsPage();

    hideLoading();

    alert(
      state.currentProductId
        ? "Product ပြင်ဆင်ပြီးပါပြီ"
        : "Product သိမ်းပြီးပါပြီ"
    );

  }catch(error){

    hideLoading();

    console.error(error);

    alert(
      "Product သိမ်းရာတွင် Error ဖြစ်ပါတယ်\n\n" +
      error.message
    );

  }

}


/* =========================================================
   PRODUCT CARDS
========================================================= */

function renderProductCards(){

  const grid=$("productsGrid");

  if(!grid){
    return;
  }

  const search =
    ($("productSearch")?.value || "")
      .trim()
      .toLowerCase();

  const category =
    $("productCategoryFilter")?.value || "";

  const filtered =
    state.products.filter(p=>{

      const matchesSearch =
        !search ||
        String(p.name||"")
          .toLowerCase()
          .includes(search) ||
        String(p.barcode||"")
          .toLowerCase()
          .includes(search);

      const matchesCategory =
        !category ||
        p.category===category;

      return matchesSearch &&
             matchesCategory;

    });


  if(!filtered.length){

    grid.innerHTML=`

      <div class="empty"
           style="grid-column:1/-1">

        <div class="empty-icon">📦</div>

        <strong>
          Product မရှိသေးပါ
        </strong>

        <p style="margin-top:6px">
          Product အသစ်ထည့်ပါ
        </p>

      </div>

    `;

    return;
  }


  grid.innerHTML =
    filtered.map(productCard).join("");

}


/* =========================================================
   PRODUCT CARD
========================================================= */

function productCard(p){

  let photoHtml =
    `<div class="no-photo">📦</div>`;

  if(p.photo_path){

    const {
      data
    } =
    supabaseClient
      .storage
      .from("product-images")
      .getPublicUrl(
        p.photo_path
      );

    if(data?.publicUrl){

      photoHtml =
        `<img
          src="${escapeHtml(data.publicUrl)}"
          alt="${escapeHtml(p.name)}"
          loading="lazy">`;

    }

  }


  const stock =
    Number(p.stock || 0);

  const min =
    Number(p.min_stock || 0);

  let badgeClass=
    "stock-ok";

  let badgeText=
    `Stock ${money(stock)}`;

  if(stock<=0){

    badgeClass="stock-out";

    badgeText="Out of Stock";

  }else if(stock<=min){

    badgeClass="stock-low";

    badgeText=`Low Stock ${money(stock)}`;

  }


  return `

    <div class="product-card">

      <div class="product-photo">
        ${photoHtml}
      </div>

      <div class="product-body">

        <div class="product-name">
          ${escapeHtml(p.name)}
        </div>

        <div class="product-meta">
          ${escapeHtml(p.category || "No Category")}
          ${p.subcategory
            ? " • "+escapeHtml(p.subcategory)
            : ""}
        </div>

        ${p.variant
          ? `<div class="product-meta">
              Variant: ${escapeHtml(p.variant)}
            </div>`
          : ""}

        <div class="price-row">

          <div class="price-box">
            <span>Retail</span>
            <strong>
              ${money(p.retail_price)} Ks
            </strong>
          </div>

          <div class="price-box">
            <span>Wholesale</span>
            <strong>
              ${money(p.wholesale_price)} Ks
            </strong>
          </div>

        </div>

        <div class="stock-row">

          <span class="stock-badge ${badgeClass}">
            ${badgeText}
          </span>

          <span style="font-size:11px;color:#6b7280">
            ${escapeHtml(p.unit || "")}
          </span>

        </div>

        <div class="card-actions">

          <button
            class="secondary-btn"
            onclick="editProduct('${p.id}')">
            Edit
          </button>

          <button
            class="danger-btn"
            onclick="deleteProduct('${p.id}')">
            Delete
          </button>

        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   DELETE PRODUCT
========================================================= */

async function deleteProduct(id){

  const p =
    state.products.find(
      x=>x.id===id
    );

  if(!p){
    return;
  }

  const ok =
    confirm(
      `"${p.name}" ကို ဖျက်မှာသေချာပါသလား?`
    );

  if(!ok){
    return;
  }

  showLoading("Product ဖျက်နေသည်...");

  try{

    const {
      error
    } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id",id)
      .eq(
        "business_id",
        state.business.id
      );

    if(error){
      throw error;
    }

    /*
      Photo ကိုလည်း ဖျက်ရန်
    */

    if(p.photo_path){

      await supabaseClient
        .storage
        .from("product-images")
        .remove([
          p.photo_path
        ]);

    }

    await loadProducts();

    renderProductsPage();

    hideLoading();

  }catch(error){

    hideLoading();

    alert(
      "Delete Error\n\n"+
      error.message
    );

  }

}

function renderSettings(){

              state.business?.name || ""
            )}"

          <label>Phone</label>

          <input
            id="settingPhone"
            value="${escapeHtml(
              state.business?.phone || ""
            )}">

        </div>

        <div class="field">

          <label>Address</label>

          <textarea id="settingAddress">${escapeHtml(
            state.business?.address || ""
          )}</textarea>

        <button
          class="primary-btn"
          type="submit">

        </button>

  `;


  $("businessSettingsForm")
    .addEventListener(

    );

}


async function saveBusinessSettings(e){

  e.preventDefault();

  showLoading(
    "Business Profile သိမ်းနေသည်..."
  );

  const {
    error
  } =
  await supabaseClient
    .from("businesses")
    .update({
      name:
        $("settingBusinessName")
          .value.trim(),

      phone:
        $("settingPhone")
          .value.trim(),

      address:
        $("settingAddress")
          .value.trim()
    })
    .eq(
      "id",
      state.business.id
    );

  hideLoading();

  if(error){

    alert(error.message);

    return;
  }

  state.business.name =
    $("settingBusinessName").value.trim();

  state.business.phone =
    $("settingPhone").value.trim();

  state.business.address =
    $("settingAddress").value.trim();

  updateBusinessUI();

  alert(
    "Business Profile သိမ်းပြီးပါပြီ"
  );

}
