<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aung POS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px;
    }

    h1 {
      text-align: center;
    }

    .box {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .add {
      background: #111827;
      color: white;
    }

    .checkout {
      background: #16a34a;
      color: white;
    }

    .cart-item {
      padding: 15px 0;
      border-bottom: 1px solid #ddd;
    }

    .total {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🛒 Aung POS</h1>

  <div class="box">

    <h2>Sales</h2>

    <input
      type="text"
      id="productName"
      placeholder="Product Name"
    >

    <input
      type="number"
      id="productPrice"
      placeholder="Price (Ks)"
    >

    <input
      type="number"
      id="productQty"
      placeholder="Quantity"
      value="1"
      min="1"
    >

    <button
      type="button"
      class="add"
      id="addButton">
      ➕ Add to Cart
    </button>

  </div>

  <div class="box">

    <h2>🛒 Cart</h2>

    <div id="cartItems">
      No products added yet.
    </div>

    <div class="total">
      Total:
      <span id="totalAmount">0 Ks</span>
    </div>

    <button
      type="button"
      class="checkout"
      id="checkoutButton">
      💰 Checkout
    </button>

  </div>

</div>

<script>

  let cart = [];

  const addButton = document.getElementById("addButton");

  addButton.addEventListener("click", function () {

    const name =
      document.getElementById("productName").value.trim();

    const price =
      Number(document.getElementById("productPrice").value);

    const qty =
      Number(document.getElementById("productQty").value);

    if (name === "") {
      alert("Product Name ထည့်ပါ");
      return;
    }

    if (price <= 0) {
      alert("Price ထည့်ပါ");
      return;
    }

    if (qty <= 0) {
      alert("Quantity ထည့်ပါ");
      return;
    }

    cart.push({
      name: name,
      price: price,
      qty: qty
    });

    document.getElementById("productName").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productQty").value = 1;

    showCart();
  });


  function showCart() {

    const cartItems =
      document.getElementById("cartItems");

    const totalAmount =
      document.getElementById("totalAmount");

    let total = 0;

    if (cart.length === 0) {

      cartItems.innerHTML =
        "No products added yet.";

      totalAmount.innerText =
        "0 Ks";

      return;
    }

    let html = "";

    cart.forEach(function(item, index) {

      const subtotal =
        item.price * item.qty;

      total += subtotal;

      html += `
        <div class="cart-item">

          <strong>${item.name}</strong>

          <br>

          ${item.qty} ×
          ${item.price.toLocaleString()} Ks

          <br>

          <strong>
            ${subtotal.toLocaleString()} Ks
          </strong>

          <br>

          <button
            type="button"
            onclick="removeItem(${index})">
            ❌ Remove
          </button>

        </div>
      `;
    });

    cartItems.innerHTML = html;

    totalAmount.innerText =
      total.toLocaleString() + " Ks";
  }


  function removeItem(index) {

    cart.splice(index, 1);

    showCart();
  }


  document.getElementById("checkoutButton")
    .addEventListener("click", function () {

      if (cart.length === 0) {

        alert("Cart ထဲမှာ ပစ္စည်းမရှိသေးပါ");

        return;
      }

      let total = 0;

      cart.forEach(function(item) {

        total += item.price * item.qty;

      });

      alert(
        "✅ SALE COMPLETED\n\n" +
        "Total: " +
        total.toLocaleString() +
        " Ks"
      );

      cart = [];

      showCart();

    });
let products = [];

function addProduct() {

  const name = document.getElementById("newProductName").value.trim();
  const cost = Number(document.getElementById("costPrice").value);
  const price = Number(document.getElementById("sellingPrice").value);
  const stock = Number(document.getElementById("stockQty").value);
  const lowStock = Number(document.getElementById("lowStock").value);

  if (name === "") {
    alert("Product Name ထည့်ပါ");
    return;
  }

  if (cost <= 0 || price <= 0) {
    alert("Cost Price နှင့် Selling Price ထည့်ပါ");
    return;
  }

  if (stock < 0) {
    alert("Stock Quantity မှန်ကန်စွာထည့်ပါ");
    return;
  }

  products.push({
    name: name,
    cost: cost,
    price: price,
    stock: stock,
    lowStock: lowStock
  });

  document.getElementById("newProductName").value = "";
  document.getElementById("costPrice").value = "";
  document.getElementById("sellingPrice").value = "";
  document.getElementById("stockQty").value = "";
  document.getElementById("lowStock").value = 5;

  showProducts();
}

function showProducts() {

  const list = document.getElementById("productList");

  if (products.length === 0) {
    list.innerHTML = "No products added yet.";
    return;
  }

  let html = "";

  products.forEach(function(product, index) {

    let warning = "";

    if (product.stock <= product.lowStock) {
      warning = " ⚠️ Low Stock";
    }

    html += `
      <div class="cart-item">
        <strong>${product.name}</strong><br>
        Cost: ${product.cost.toLocaleString()} Ks<br>
        Selling: ${product.price.toLocaleString()} Ks<br>
        Stock: ${product.stock}${warning}
        <br>
        <button type="button" onclick="deleteProduct(${index})">
          🗑️ Delete
        </button>
      </div>
    `;
  });

  list.innerHTML = html;
}

function deleteProduct(index) {

  products.splice(index, 1);

  showProducts();
}
</script>
<div class="box">

  <h2>📦 Product & Stock Management</h2>

  <input
    type="text"
    id="newProductName"
    placeholder="Product Name"
  >

  <input
    type="number"
    id="costPrice"
    placeholder="Cost Price (Ks)"
  >

  <input
    type="number"
    id="sellingPrice"
    placeholder="Selling Price (Ks)"
  >

  <input
    type="number"
    id="stockQty"
    placeholder="Stock Quantity"
  >

  <input
    type="number"
    id="lowStock"
    placeholder="Low Stock Alert"
    value="5"
  >

  <button
    type="button"
    class="add"
    onclick="addProduct()">
    ➕ Add Product
  </button>

  <div id="productList" style="margin-top:20px;">
    No products added yet.
  </div>

</div>
</body>
</html>
