<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aung POS</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:18px;text-align:center}
.container{max-width:1000px;margin:auto;padding:15px}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:15px}
.card{background:white;padding:18px;border-radius:12px;box-shadow:0 2px 8px #ddd}
.card small{color:#6b7280}
.card strong{display:block;font-size:22px;margin-top:8px}

.box{background:white;padding:18px;border-radius:12px;margin-bottom:15px}
h2{margin-top:0}

input{
width:100%;
padding:12px;
margin:6px 0;
border:1px solid #d1d5db;
border-radius:8px
}

button{
border:0;
padding:10px 14px;
border-radius:8px;
background:#2563eb;
color:white;
cursor:pointer;
margin:3px
}

button.delete{background:#dc2626}
button.stock{background:#16a34a}

.product{
display:flex;
justify-content:space-between;
align-items:center;
border:1px solid #e5e7eb;
padding:12px;
border-radius:10px;
margin:8px 0
}

.low{color:#dc2626;font-weight:bold}

.cart-item{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid #eee
}

.total{
font-size:22px;
font-weight:bold;
text-align:right;
margin-top:15px
}

.checkout{
width:100%;
background:#16a34a;
font-size:18px;
padding:14px
}

@media(max-width:700px){
.cards{grid-template-columns:1fr}
.product{display:block}
}
</style>
</head>

<body>

<header>
<h1>🛒 Aung POS</h1>
<p>Sales & Stock Management</p>
</header>

<div class="container">

<div class="cards">

<div class="card">
<small>ယနေ့ရောင်းအား</small>
<strong id="todaySales">0 Ks</strong>
</div>

<div class="card">
<small>အော်ဒါ</small>
<strong id="orderCount">0</strong>
</div>

<div class="card">
<small>Stock Items</small>
<strong id="stockCount">0</strong>
</div>

</div>


<!-- ADD PRODUCT -->

<div class="box">

<h2>➕ Product အသစ်ထည့်ရန်</h2>

<input id="productName" placeholder="Product Name">

<input id="productPrice"
type="number"
placeholder="Selling Price">

<input id="productStock"
type="number"
placeholder="Stock Quantity">

<button onclick="addProduct()">
➕ Add Product
</button>

</div>


<!-- PRODUCTS -->

<div class="box">

<h2>📦 Product & Stock</h2>

<div id="products"></div>

</div>


<!-- CART -->

<div class="box">

<h2>🛒 Cart</h2>

<div id="cart">
Cart is empty
</div>

<div class="total">
Total: <span id="total">0</span> Ks
</div>

<button class="checkout" onclick="checkout()">
💵 Checkout
</button>

</div>

</div>


<script>

let products =
JSON.parse(localStorage.getItem("aungProducts")) || [

{
name:"Coca Cola",
price:2000,
stock:20
},

{
name:"Pepsi",
price:2000,
stock:20
},

{
name:"Mineral Water",
price:1000,
stock:30
}

];

let cart=[];

let todaySales =
Number(localStorage.getItem("todaySales")) || 0;

let orderCount =
Number(localStorage.getItem("orderCount")) || 0;


function saveData(){

localStorage.setItem(
"aungProducts",
JSON.stringify(products)
);

localStorage.setItem(
"todaySales",
todaySales
);

localStorage.setItem(
"orderCount",
orderCount
);

}


function addProduct(){

let name=
document.getElementById("productName").value.trim();

let price=
Number(document.getElementById("productPrice").value);

let stock=
Number(document.getElementById("productStock").value);


if(!name || price<=0 || stock<0){

alert("Product Name, Price နဲ့ Stock ကို မှန်ကန်စွာထည့်ပါ။");

return;

}


products.push({
name:name,
price:price,
stock:stock
});


saveData();

document.getElementById("productName").value="";
document.getElementById("productPrice").value="";
document.getElementById("productStock").value="";

renderProducts();

alert("✅ Product ထည့်ပြီးပါပြီ");

}


function renderProducts(){

let box=
document.getElementById("products");

box.innerHTML="";


products.forEach((product,index)=>{

let lowStock =
product.stock <= 5;


box.innerHTML += `

<div class="product">

<div>

<strong>${product.name}</strong>

<br>

${product.price.toLocaleString()} Ks

<br>

<span class="${lowStock ? 'low':''}">

Stock: ${product.stock}

${lowStock ? ' ⚠️ Low Stock':''}

</span>

</div>


<div>

<button onclick="addToCart(${index})">

🛒 Add

</button>

<button class="stock"
onclick="addStock(${index})">

+ Stock

</button>

<button class="delete"
onclick="deleteProduct(${index})">

🗑️

</button>

</div>

</div>

`;

});


document.getElementById("stockCount").innerText=
products.length;

}


function addStock(index){

let qty=
Number(prompt("Stock ဘယ်နှစ်ခု ထည့်မလဲ?"));


if(!qty || qty<=0)return;


products[index].stock += qty;

saveData();

renderProducts();

}


function deleteProduct(index){

if(confirm(
products[index].name +
" ကို ဖျက်မှာသေချာပါသလား?"
)){

products.splice(index,1);

saveData();

renderProducts();

}

}


function addToCart(index){

let product=products[index];


if(product.stock<=0){

alert("❌ Stock မရှိတော့ပါ");

return;

}


let existing=
cart.find(item=>item.index===index);


if(existing){

if(existing.qty < product.stock){

existing.qty++;

}else{

alert("Stock ထက်ပိုပြီး မရောင်းနိုင်ပါ");

return;

}

}else{

cart.push({
index:index,
qty:1
});

}


renderCart();

}


function removeCart(index){

cart.splice(index,1);

renderCart();

}


function renderCart(){

let box=document.getElementById("cart");


if(cart.length===0){

box.innerHTML="Cart is empty";

document.getElementById("total").innerText="0";

return;

}


let total=0;

box.innerHTML="";


cart.forEach((item,i)=>{

let product=products[item.index];

let subtotal=
product.price * item.qty;

total+=subtotal;


box.innerHTML += `

<div class="cart-item">

<span>

${product.name}

<br>

${item.qty} ×
${product.price.toLocaleString()} Ks

</span>

<span>

${subtotal.toLocaleString()} Ks

<button
class="delete"
onclick="removeCart(${i})">

X

</button>

</span>

</div>

`;

});


document.getElementById("total").innerText=
total.toLocaleString();

}


function checkout(){

if(cart.length===0){

alert("Cart ထဲမှာ Product မရှိသေးပါ");

return;

}


let total=0;


cart.forEach(item=>{

let product=products[item.index];

product.stock -= item.qty;

total += product.price * item.qty;

});


todaySales += total;

orderCount++;

cart=[];

saveData();

renderProducts();

renderCart();

updateDashboard();

alert(
"✅ Sale Complete!\n\nTotal: "
+
total.toLocaleString()
+
" Ks"
);

}


function updateDashboard(){

document.getElementById("todaySales").innerText=
todaySales.toLocaleString()+" Ks";

document.getElementById("orderCount").innerText=
orderCount;

}


renderProducts();

renderCart();

updateDashboard();

</script>

</body>
</html>
