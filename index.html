<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aung POS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <div class="logo">Aung POS</div>
    <div class="user">👤 Admin</div>
  </header>

  <main class="container">

    <h1>Dashboard</h1>
    <p class="subtitle">Welcome to Aung POS Professional</p>

    <section class="cards">

      <div class="card">
        <span>💰</span>
        <h3>Today's Sales</h3>
        <strong>0 Ks</strong>
      </div>

      <div class="card">
        <span>📦</span>
        <h3>Total Products</h3>
        <strong>0</strong>
      </div>

      <div class="card">
        <span>📈</span>
        <h3>Today's Profit</h3>
        <strong>0 Ks</strong>
      </div>

      <div class="card">
        <span>👥</span>
        <h3>Customers</h3>
        <strong>0</strong>
      </div>

    </section>

    <section class="menu">

      <button onclick="showMessage('Sales')">
        🛒 Sales
      </button>

      <button onclick="showMessage('Products')">
        📦 Products
      </button>

      <button onclick="showMessage('Inventory')">
        📊 Inventory
      </button>

      <button onclick="showMessage('Customers')">
        👥 Customers
      </button>

      <button onclick="showMessage('Reports')">
        📈 Reports
      </button>

      <button onclick="showMessage('Settings')">
        ⚙️ Settings
      </button>

    </section>

    <section class="plan">
      <h2>Current Plan</h2>
      <p>FREE VERSION</p>
      <button onclick="upgradePro()">Upgrade to PRO 🚀</button>
    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
