<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aung POS</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .box {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 12px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      font-size: 16px;
    }

    .add {
      width: 100%;
    }

    .checkout {
      width: 100%;
    }

    .item {
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🛒 Aung POS</h1>

  <div class="box">

    <h2>Add Sale</h2>

    <input
      type="text"
      id="productName"
      placeholder="Product Name"
    >

    <input
      type="number"
      id="productPrice"
      placeholder="Price (Ks)"
    >

    <input
      type="number"
      id="productQty"
      placeholder="Quantity"
      value="1"
      min="1"
    >

    <button class="add" onclick="addToCart()">
      ➕ Add to Cart
    </button>

  </div>

  <div class="box">

    <h2>🛒 Cart</h2>

    <div id="cartItems">
      No products yet.
    </div>

    <div class="total">
      Total: <span id="totalAmount">0 Ks</span>
    </div>

    <button class="checkout" onclick="checkout()">
      💰 Checkout
    </button>

  </div>

</div>

<script>

let cart = [];

function addToCart() {

  const name =
    document.getElementById("productName").value.trim();

  const price =
    Number(document.getElementById("productPrice").value);

  const qty =
    Number(document.getElementById("productQty").value);

  if (name === "") {
    alert("Product name ထည့်ပါ");
    return;
  }

  if (price <= 0) {
    alert("Price ထည့်ပါ");
    return;
  }

  if (qty <= 0) {
    alert("Quantity ထည့်ပါ");
    return;
  }

  cart.push({
    name: name,
    price: price,
    qty: qty
  });

  document.getElementById("productName").value = "";
  document.getElementById("productPrice").value = "";
  document.getElementById("productQty").value = 1;

  showCart();
}


function showCart() {

  const cartItems =
    document.getElementById("cartItems");

  const totalAmount =
    document.getElementById("totalAmount");

  if (cart.length === 0) {

    cartItems.innerHTML =
      "No products yet.";

    totalAmount.innerText =
      "0 Ks";

    return;
  }

  let total = 0;
  let html = "";

  cart.forEach(function(item, index) {

    const subtotal =
      item.price * item.qty;

    total += subtotal;

    html += `
      <div class="item">

        <strong>${item.name}</strong>

        <br>

        ${item.qty} ×
        ${item.price.toLocaleString()} Ks

        <br>

        <strong>
          ${subtotal.toLocaleString()} Ks
        </strong>

        <br>

        <button onclick="removeItem(${index})">
          ❌ Remove
        </button>

      </div>
    `;
  });

  cartItems.innerHTML = html;

  totalAmount.innerText =
    total.toLocaleString() + " Ks";
}


function removeItem(index) {

  cart.splice(index, 1);

  showCart();
}


function checkout() {

  if (cart.length === 0) {

    alert("Cart ထဲမှာ ပစ္စည်းမရှိသေးပါ");

    return;
  }

  let total = 0;

  cart.forEach(function(item) {

    total +=
      item.price * item.qty;

  });

  alert(
    "✅ SALE COMPLETED\n\n" +
    "Total: " +
    total.toLocaleString() +
    " Ks"
  );

  cart = [];

  showCart();
}

</script>

</body>
</html>
