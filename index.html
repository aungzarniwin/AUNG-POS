<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aung POS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <div class="logo">Aung POS</div>
    <div class="user">👤 Admin</div>
  </header>

  <main class="container">

  <h1>Sales</h1>
  <p class="subtitle">Create a new sale</p>

  <section class="sales-box">

    <div class="input-group">
      <label>Product Name</label>
      <input type="text" id="productName" placeholder="Enter product name">
    </div>

    <div class="input-group">
      <label>Price (Ks)</label>
      <input type="number" id="productPrice" placeholder="0">
    </div>

    <div class="input-group">
      <label>Quantity</label>
      <input type="number" id="productQty" value="1" min="1">
    </div>

    <button class="add-btn" onclick="addToCart()">
      ➕ Add to Cart
    </button>

  </section>

  <section class="cart-box">

    <h2>🛒 Cart</h2>

    <div id="cartItems">
      <p>No products added yet.</p>
    </div>

    <div class="total">
      Total: <strong id="totalAmount">0 Ks</strong>
    </div>

    <button class="checkout-btn" onclick="checkout()">
      💰 Checkout
    </button>

  </section>

</main>
  <script src="app.js"></script>

</body>
</html>
